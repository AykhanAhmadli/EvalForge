[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend/src", "worker/src", "cli/src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
extend-ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["backend/src", "worker/src", "cli/src"]
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["backend/src", "worker/src", "cli/src"]
testpaths = ["tests"]
