services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evalforge}
      POSTGRES_USER: ${POSTGRES_USER:-evalforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evalforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evalforge}:${POSTGRES_PASSWORD:-evalforge}@db:5432/${POSTGRES_DB:-evalforge}
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    command: ["uvicorn", "evalforge_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evalforge}:${POSTGRES_PASSWORD:-evalforge}@db:5432/${POSTGRES_DB:-evalforge}
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: http://localhost:5173
      DEFAULT_PROVIDER: fake
      FAKE_PROVIDER_SEED: evalforge-local
      API_AUTH_REQUIRED: ${API_AUTH_REQUIRED:-false}
      API_KEYS: ${API_KEYS:-}
      API_KEY_WORKSPACES: ${API_KEY_WORKSPACES:-}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-10485760}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    command: ["python", "-m", "evalforge_worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evalforge}:${POSTGRES_PASSWORD:-evalforge}@db:5432/${POSTGRES_DB:-evalforge}
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_PROVIDER: fake
      FAKE_PROVIDER_SEED: evalforge-local
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_API_KEY: ${VITE_API_KEY:-}
      VITE_WORKSPACE_ID: ${VITE_WORKSPACE_ID:-}
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
