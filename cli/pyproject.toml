[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge-cli"
version = "0.1.0"
description = "Command-line client for the EvalForge API."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12"
]

[project.scripts]
evalforge = "evalforge_cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
